services:
  - type: web
    name: snakeomg-google-sites
    runtime: docker
    plan: 0.5c-512mb
    numInstances: 1
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_PATH
        value: /var/data/snakeomg.sqlite
    disk:
      name: snakeomg-data
      mountPath: /var/data
      sizeGB: 1
